{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="/css/style.css?v=18" />
    <link rel="stylesheet" type="text/css" href="/css/fontello.css?v=2" />
    <link rel="stylesheet" type="text/css" href="/css/themes/nitter.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ff6c60" />
    {{if .title}}<title>{{.title}} | {{.cfg.Title}}</title>
    {{else}}<title>{{.cfg.Title}}</title>{{end}}
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F1F1F" />
    <meta property="og:site_name" content="Nitter" />
    <meta property="og:locale" content="en_US" />
</head>
<body>
    <nav><div class="inner-nav">
        <div class="nav-item"><a class="site-name" href="/">{{.cfg.Title}}</a></div>
        <a href="/"><img class="site-logo" src="/logo.png" alt="Logo" /></a>
        <div class="nav-item right">
            <div class="icon-container"><a class="icon-search" title="Search" href="/search"></a></div>
            <div class="icon-container"><a class="icon-cog" title="Preferences" href="/settings"></a></div>
            <div class="icon-container"><a class="icon-info-circled" title="About" href="/about"></a></div>
        </div>
    </div></nav>
    <div class="container">
{{end}}

{{define "footer"}}
    </div>
</body>
</html>
{{end}}
